spec:
  inputs:
    no-cache:
      type: boolean
      default: false
      description: Whether to disable the build cache when building the image.
---
include:
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/goreleaser-release@12
    inputs:
      config: .goreleaser-fork.yml
  - component: $CI_SERVER_FQDN/oaklab/ci-templates/goreleaser-test@12

stages:
  - test
  - image
  - release

variables:
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"

build image:
  stage: image
  trigger:
    strategy: mirror
    include:
      - component: $CI_SERVER_FQDN/oaklab/ci-templates/hadolint@12
        inputs:
          paths:
            - Dockerfile
            - standalone.Dockerfile
      - component: $CI_SERVER_FQDN/oaklab/ci-templates/oci-publish@12
        inputs:
          dockerfile: standalone.Dockerfile
          licenses: MIT
          platforms:
            - linux/amd64
            - linux/arm64
          registry-cache: true
          no-cache: $[[ inputs.no-cache ]]
          # Full clone so the Dockerfile's `git describe` sees tags and can
          # stamp the version on untagged builds too.
          git-depth: 0
